[project]
name = "nginx-log-explorer-backend"
version = "0.1.0"
description = "Backend foundation for Nginx Log Explorer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "sqlalchemy==2.0.54",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.8.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
